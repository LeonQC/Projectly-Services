services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: projectly-postgres
    environment:
      POSTGRES_USER: projectly
      POSTGRES_PASSWORD: projectly
      POSTGRES_DB: projectly
    ports:
      - "5432:5432"
    volumes:
      - projectly_postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.1
    container_name: projectly-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  search-service:
    build: .
    container_name: projectly-search-service
    command: python -u -m app.workers.search_consumer
    depends_on:
      - postgres
      - elasticsearch
      - kafka
    environment:
      DATABASE_URL: postgresql+psycopg://projectly:projectly@postgres:5432/projectly
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEARCH_EVENTS_TOPIC: projectly.search.events

  redis:
    image: redis:7
    container_name: projectly-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    container_name: projectly-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - projectly_elasticsearch_data:/usr/share/elasticsearch/data

  rag-attachment-service:
    build: .
    container_name: projectly-rag-attachment-service
    command: python -u -m app.workers.rag_attachment_consumer
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
    environment:
      DATABASE_URL: postgresql+psycopg://projectly:projectly@postgres:5432/projectly
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAG_INGESTION_EVENTS_TOPIC: projectly.rag.ingestion.events

      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_STORAGE_BUCKET: projectly-attachments

      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSIONS: 384
    volumes:
      - projectly_huggingface_cache:/root/.cache/huggingface

  rag-index-service:
    build: .
    container_name: projectly-rag-index-service
    command: python -u -m app.workers.rag_index_consumer
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
    environment:
      DATABASE_URL: postgresql+psycopg://projectly:projectly@postgres:5432/projectly
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAG_INDEX_EVENTS_TOPIC: projectly.rag.index.events

      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSIONS: 384
    volumes:
      - projectly_huggingface_cache:/root/.cache/huggingface

volumes:
  projectly_postgres_data:
  projectly_elasticsearch_data:
  projectly_huggingface_cache:
