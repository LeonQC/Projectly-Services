services:
  postgres:
    image: postgres:16
    container_name: projectly-postgres
    environment:
      POSTGRES_USER: projectly
      POSTGRES_PASSWORD: projectly
      POSTGRES_DB: projectly
    ports:
      - "5432:5432"
    volumes:
      - projectly_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: projectly-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.3
    container_name: projectly-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - projectly_elasticsearch_data:/usr/share/elasticsearch/data

volumes:
  projectly_postgres_data:
  projectly_elasticsearch_data:
